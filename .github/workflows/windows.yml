name: Windows

# Builds Quota Tray, this fork's Windows app: the shared Swift engine (`openusage-cli.exe`, shipped as
# `quotatray-engine.exe`) plus the WPF notification-area app (`QuotaTray.exe`), packaged into one zip
# artifact and an installer. Run by hand on main with "Publish release" checked, it also publishes them
# as a GitHub release. See docs/windows.md.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release with this build (main only; the version comes from windows/QuotaTray/QuotaTray.csproj)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The runner's Visual Studio ships an MSVC STL that asks for Clang 20+, newer than the Clang inside
  # the Swift 6.2 toolchain. swift-crypto's BoringSSL is the only C++ in the build and compiles fine
  # with it, so allow the mismatch rather than pinning an older Visual Studio.
  STL_MISMATCH: -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

jobs:
  windows:
    name: Build Windows App
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read Quota Tray version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content windows/QuotaTray/QuotaTray.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'QuotaTray.csproj has no Version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Quota Tray $version"

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Build engine
        run: swift build -c release --product openusage-cli ${{ env.STL_MISMATCH }}

      - name: Smoke-test engine
        shell: pwsh
        run: |
          $out = .build/release/openusage-cli.exe dashboard --cached | ConvertFrom-Json
          if ($out.schema -ne 'openusage.desktop.v1') { throw "unexpected schema: $($out.schema)" }
          Write-Host "providers: $($out.providers.id -join ', ')"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish tray app
        run: >
          dotnet publish windows/QuotaTray/QuotaTray.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/QuotaTray

      - name: Test panel sizing
        run: dotnet run --project windows/QuotaTray.Tests/QuotaTray.Tests.csproj -c Release

      - name: Render panel screenshots
        shell: pwsh
        run: |
          $p = Start-Process dist/QuotaTray/QuotaTray.exe -Wait -PassThru -ArgumentList @(
            '--render-preview', 'windows/QuotaTray/Preview/sample-dashboard.json', 'dist/screenshots')
          if ($p.ExitCode -ne 0) { throw "preview render failed ($($p.ExitCode))" }
          Get-ChildItem dist/screenshots | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-windows-screenshots
          path: dist/screenshots
          if-no-files-found: error

      - name: Package
        shell: pwsh
        run: windows/scripts/package.ps1 -BuildDir .build/release -OutDir dist/QuotaTray

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-windows-x64
          path: dist/QuotaTray
          if-no-files-found: error

      - name: Build installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y | Out-Null
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc.exe "/DAppVersion=$version" "/DAppDir=$PWD\dist\QuotaTray" "/DOutputDir=$PWD\dist\installer" windows\installer\QuotaTray.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }

      - name: Smoke-test installer
        shell: pwsh
        env:
          # install.ps1 as pasted by a user, but with this build's installer and without starting the app.
          QUOTATRAY_SETUP: ${{ github.workspace }}\dist\installer\QuotaTray-Setup-x64.exe
          QUOTATRAY_NO_LAUNCH: '1'
        run: |
          Get-Content windows/installer/install.ps1 -Raw | Invoke-Expression
          $app = Join-Path $env:LOCALAPPDATA 'Programs\QuotaTray'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Quota Tray.lnk'
          if (-not (Test-Path $menu)) { throw 'the Start menu shortcut is missing' }
          $check = & (Join-Path $app 'quotatray-engine.exe') dashboard --cached | ConvertFrom-Json
          if ($check.schema -ne 'openusage.desktop.v1') { throw 'installed engine failed its smoke test' }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name QuotaTray -ErrorAction SilentlyContinue
          if (-not $run) { throw 'the startup task did not add Launch at Login' }
          if ((Get-ItemProperty 'HKCU:\Software\QuotaTray').LaunchAtLoginDefaulted -ne 1) {
            throw 'the installer did not record the Launch at Login default'
          }
          Get-Content windows/installer/uninstall.ps1 -Raw | Invoke-Expression
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $app 'QuotaTray.exe')) { throw 'uninstall left the app behind' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name QuotaTray -ErrorAction SilentlyContinue) {
            throw 'uninstall left Launch at Login behind'
          }
          if (Test-Path $menu) { throw 'uninstall left the Start menu shortcut behind' }

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-windows-setup
          path: dist/installer/*.exe
          if-no-files-found: error

  release:
    # Publishes only when run by hand on main with "Publish release" checked, and only after the app,
    # the installer check, and every test job passed.
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: [windows, engine-tests-windows, engine-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: QuotaTray-windows-setup
          path: dist/installer
      - uses: actions/download-artifact@v4
        with:
          name: QuotaTray-windows-x64
          path: dist/QuotaTray
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          tag="quotatray-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag is already released; raise the Version in windows/QuotaTray/QuotaTray.csproj first"
            exit 1
          fi
          (cd dist && zip -qr QuotaTray-windows-x64.zip QuotaTray)
          # What changed since the previous Quota Tray release: GitHub's generated list of merged PRs plus
          # a compare link, dropped into the notes template at {CHANGES}.
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("quotatray-v"))][0] // empty')
          args=(-f tag_name="$tag" -f target_commitish="$GITHUB_SHA")
          if [ -n "$prev" ]; then args+=(-f previous_tag_name="$prev"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > dist/changes.md
          awk -v version="$VERSION" '
            FNR == NR { changes = changes $0 "\n"; next }
            $0 == "{CHANGES}" { printf "%s", changes; next }
            { gsub(/[{]VERSION[}]/, version); print }
          ' dist/changes.md windows/installer/release-notes.md > dist/notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Quota Tray $VERSION" --notes-file dist/notes.md --latest \
            dist/installer/QuotaTray-Setup-x64.exe dist/QuotaTray-windows-x64.zip \
            windows/installer/install.ps1 windows/installer/uninstall.ps1

  engine-tests-windows:
    name: Engine Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Install tools the providers shell out to
        run: |
          choco install sqlite --no-progress -y
          where.exe sqlite3 cmd powershell
      - run: swift test ${{ env.STL_MISMATCH }}

  engine-linux:
    # Keeps the engine portable: the same non-Apple code paths Windows uses, on Linux.
    name: Engine Build and Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools the providers shell out to
        run: apt-get update && apt-get install -y --no-install-recommends lsof sqlite3
      - run: swift build
      - run: swift test
